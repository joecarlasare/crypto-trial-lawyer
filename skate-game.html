/* ------------------------------ CONFIG --------------------------------- */

function R(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x|0,y|0,w|0,h|0);}
function font(sz){const f='bold '+sz+'px "Courier New",Courier,monospace';if(f!==curFont){ctx.font=f;curFont=f;}}

const clamp=(v,a,b)=>v<a?a:(v>b?b:v);

/* ------------------------------- SAVE ---------------------------------- */
const SAVEKEY='bfs_nes_v3';
let storageOK=true;
function defSave(){return{unlocked:1,best:[0,0,0,0,0],stars:[0,0,0,0,0],
  sound:true,music:true,scan:false,flip:false,autorun:false};}
function loadSave(){
  const d=defSave();
  try{
    const r=localStorage.getItem(SAVEKEY);
    if(r){const o=JSON.parse(r);
      for(const k in d){ if(o[k]!==undefined && typeof o[k]===typeof d[k]) d[k]=o[k]; }
      if(!Array.isArray(d.best)||d.best.length!==5) d.best=[0,0,0,0,0];
      if(!Array.isArray(d.stars)||d.stars.length!==5) d.stars=[0,0,0,0,0];
      d.unlocked=clamp(d.unlocked|0,1,5);
    }
  }catch(e){storageOK=false;}
  return d;
}

/* ------------------------------- AUDIO --------------------------------- */
const AU={ctx:null,master:null,nbuf:null,track:null,name:null,step:0,nextT:0,speed:1};
function aInit(){
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  if(!AU.ctx){
    try{AU.ctx=new AC();}catch(e){return;}
    AU.master=AU.ctx.createGain(); AU.master.gain.value=0.28; AU.master.connect(AU.ctx.destination);
    const len=AU.ctx.sampleRate; AU.nbuf=AU.ctx.createBuffer(1,len,AU.ctx.sampleRate);
    const ch=AU.nbuf.getChannelData(0); for(let i=0;i<len;i++) ch[i]=Math.random()*2-1;
    try{
      const b=AU.ctx.createBuffer(1,1,22050), s=AU.ctx.createBufferSource();
      s.buffer=b; s.connect(AU.ctx.destination); s.start(0);
    }catch(e){}
    AU.nextT=AU.ctx.currentTime;
  }
  if(AU.ctx.state!=='running'){ const p=AU.ctx.resume(); if(p&&p.catch) p.catch(()=>{}); }
}
const mf=m=>440*Math.pow(2,(m-69)/12);
const aOK=()=>AU.ctx&&AU.ctx.state==='running'&&SAVE.sound;
function note(m,t,d,type,vol){
  if(!aOK()) return;
  const o=AU.ctx.createOscillator(), g=AU.ctx.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(mf(m),t);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.12,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g); g.connect(AU.master); o.start(t); o.stop(t+d+0.02);
}
function noise(t,d,vol){
  if(!aOK()) return;
  const s=AU.ctx.createBufferSource(), g=AU.ctx.createGain(); s.buffer=AU.nbuf;
  g.gain.setValueAtTime(vol||0.1,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  s.connect(g); g.connect(AU.master); s.start(t,Math.random()*0.5,d+0.02);
}
function sweep(f1,f2,d,type,vol){
  if(!aOK()) return;
  const t=AU.ctx.currentTime, o=AU.ctx.createOscillator(), g=AU.ctx.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(vol||0.13,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g); g.connect(AU.master); o.start(t); o.stop(t+d+0.02);
}
function sfx(n){
  if(!aOK()) return;
  const t=AU.ctx.currentTime, seq=(a,s,d,ty,v)=>a.forEach((m,i)=>{ if(m) note(m,t+i*s,d,ty||'square',v||0.12); });
  switch(n){
    case 'jump':  sweep(250,560,0.15,'square',0.11); break;
    case 'flip':  sweep(520,1040,0.16,'square',0.10); break;
    case 'stomp': sweep(520,140,0.10,'square',0.13); break;
    case 'kick':  note(84,t,0.05,'square',0.12); noise(t,0.05,0.08); break;
    case 'bump':  sweep(170,90,0.08,'triangle',0.22); break;
    case 'brick': noise(t,0.2,0.16); sweep(220,60,0.12,'square',0.07); break;
    case 'coin':  note(83,t,0.06,'square',0.11); note(88,t+0.06,0.24,'square',0.11); break;
    case 'sprout':seq([60,64,67,72,76,79],0.04,0.06,'square',0.10); break;
    case 'power': seq([67,71,74,79,83,86,91],0.05,0.08,'square',0.11); break;
    case 'hurt':  sweep(440,100,0.35,'square',0.13); break;
    case 'die':   seq([71,77,0,77,77,76,74,72],0.12,0.11,'square',0.12); break;
    case 'tag':   seq([76,81,88],0.07,0.12,'square',0.14); break;
    case 'open':  note(72,t,0.10,'triangle',0.16); note(79,t+0.09,0.16,'triangle',0.16); break;
    case 'throw': sweep(240,150,0.10,'triangle',0.10); break;
    case 'warn':  note(60,t,0.08,'sawtooth',0.09); note(60,t+0.14,0.08,'sawtooth',0.09); break;
    case 'check': seq([72,76,83],0.08,0.12,'square',0.13); break;
    case 'clear': seq([72,76,79,84,79,84,88],0.11,0.16,'square',0.14); break;
    case 'over':  seq([72,67,63,58,55],0.16,0.24,'triangle',0.15); break;
    case 'menu':  note(84,t,0.04,'square',0.08); break;
    case 'pause': seq([76,72,76,72],0.07,0.07,'square',0.10); break;
    case 'tick':  note(96,t,0.03,'square',0.05); break;
    case 'hurry': seq([84,85,86,84,85,86],0.08,0.07,'square',0.10); break;
  }
}

function playTrack(name){
  if(AU.name===name) return;
  AU.name=name; AU.track=name?TRACKS[name]:null; AU.step=0;
  if(AU.ctx) AU.nextT=AU.ctx.currentTime+0.05;
}
function musicUpdate(){
  if(!AU.ctx||AU.ctx.state!=='running'||!AU.track||!SAVE.music||!SAVE.sound) return;
  const now=AU.ctx.currentTime, tr=AU.track, d=tr.dur/AU.speed;
  if(AU.nextT<now) AU.nextT=now+0.02;
  let g=0;
  while(AU.nextT<now+0.25&&g++<40){
    const l=tr.lead[AU.step%tr.lead.length], b=tr.bass[AU.step%tr.bass.length];
    if(l) note(l,AU.nextT,d*0.85,'square',0.075);
    if(b) note(b,AU.nextT,d*0.95,'triangle',0.13);
    if(AU.step%4===0) noise(AU.nextT,0.03,0.045);
    AU.nextT+=d; AU.step++;
  }
}

const solidT=t=>t>=1&&t<=9;
function mk(cols){
  const L={cols,map:new Uint8Array(cols*ROWS),q:{},foes:[],lifts:[],cps:[],signs:[],bossC:cols-16};
  for(let c=0;c<cols;c++){L.map[13*cols+c]=T_GROUND;L.map[14*cols+c]=T_GROUND;}
  return L;
}
function st(L,c,r,t){ if(c>=0&&c<L.cols&&r>=0&&r<ROWS) L.map[r*L.cols+c]=t; }
function pit(L,c,w){ for(let i=0;i<w;i++){st(L,c+i,13,0);st(L,c+i,14,0);} }
function row(L,c,r,s){
  for(let i=0;i<s.length;i++){const ch=s[i],x=c+i;
    if(ch==='B') st(L,x,r,T_BRICK);
    else if(ch==='?'){st(L,x,r,T_Q);L.q[x+','+r]='star';}
    else if(ch==='H'){st(L,x,r,T_Q);L.q[x+','+r]='heart';}
    else if(ch==='X') st(L,x,r,T_HARD);
    else if(ch==='*') st(L,x,r,T_STAR);
  }
}
function stairs(L,c,h,dir){ for(let i=0;i<h;i++){const x=dir>0?c+i:c+h-1-i; for(let k=0;k<=i;k++) st(L,x,12-k,T_HARD);} }
function tower(L,c,h){ for(let k=0;k<h;k++) st(L,c,12-k,T_HARD); }
function pipe(L,c,h){ const top=13-h; st(L,c,top,T_PTL);st(L,c+1,top,T_PTR);
  for(let r=top+1;r<13;r++){st(L,c,r,T_PBL);st(L,c+1,r,T_PBR);} }

function cp(L,c){ L.cps.push(c*TS); }

let hearts=3, score=0, levelStartScore=0, starsGot=0, totalStars=0, cpIndex=-1, clearBonus=0;
let timeLeft=300, timeTick=0, hurried=false;
let boss=null, bossActive=false, arenaX=0;
let introT=0, clearT=0, tallyDone=false, deadT=0, dieT=0, winT=0, frames=0, msg=null, msgT=0, stompChain=0, flashT=0;
let uiHits=[];
let INP={l:false,r:false,a:false,b:false,jp:false};
const P={x:0,y:0,w:12,h:28,vx:0,vy:0,face:1,grounded:false,rider:null,inv:0,st:'idle',anim:0,
  coy:0,jbuf:0,airMax:PH.WALK,dj:true,flip:0,skid:false,oy:0,hidden:false,gi:1,jumping:false,kick:0};

function say(t,time){msg=t;msgT=time||120;}
function addScore(p,x,y){score+=p; if(x!==undefined) popups.push({x,y,text:String(p),t:45});}
function burst(x,y,c,n,spd,sz){
  for(let i=0;i<(n||8);i++) particles.push({x,y,vx:(Math.random()-0.5)*(spd||3),vy:-Math.random()*(spd||3),
    t:20+Math.random()*16,c:c||'#fff',s:sz||2});
}
function tileAt(c,r){ if(c<0||c>=cols) return T_HARD; if(r<0||r>=ROWS) return 0; return map[r*cols+c]; }
function setT(c,r,t){ if(c>=0&&c<cols&&r>=0&&r<ROWS) map[r*cols+c]=t; }

/* ---------------------------- LEVEL LOADING ----------------------------- */
let LD=null, cpStars=0, pausedTrack=null, prevA=false;
const KB={l:false,r:false,u:false,d:false,a:false,b:false};
const TP={l:false,r:false,u:false,d:false,a:false,b:false,s:false};

function makeFoe(d){
  const c=d[0],kind=d[1],r=d[2];
  const h=kind==='bot'?16:(kind==='ball'?14:12);
  return {x:c*TS+1,y:(r+1)*TS-h,w:14,h:h,vx:kind==='ball'?-0.6:-0.5,vy:0,kind:kind,
          state:'walk',t:0,tm:0,active:false,chain:0};
}
function makeLift(o){
  const x=o.c*TS,y=o.r*TS;
  return {x:x,y:y,ox:x,oy:y,w:o.w*TS,h:8,axis:o.axis,range:o.range,spd:o.spd,ph:o.ph,dx:0,dy:0};
}
function loadLevel(i){
  lvIdx=i; lv=LEVELS[i]; LD=lv.build();
  cols=LD.cols; map=LD.map; qmap=LD.q; arenaX=LD.bossC*TS; maxCam=arenaX;
  totalStars=0;
  for(let k=0;k<map.length;k++) if(map[k]===T_STAR) totalStars++;
  for(const key in qmap) if(qmap[key]==='star') totalStars++;
  foes=LD.foes.map(makeFoe); lifts=LD.lifts.map(makeLift);
  items=[]; coinsFx=[]; particles=[]; popups=[]; bumps=[]; projectiles=[];
  starsGot=0;
  let sx=40;
  if(cpIndex>=0){
    sx=LD.cps[cpIndex];
    const cc=Math.floor(sx/TS);
    for(let c=0;c<cc;c++) for(let r=0;r<ROWS;r++){
      const t=map[r*cols+c];
      if(t===T_STAR) map[r*cols+c]=0;
      else if(t===T_Q && qmap[c+','+r]==='star') map[r*cols+c]=T_USED;
    }
    foes=foes.filter(f=>f.x>sx+96);
    starsGot=cpStars;
  }
  hearts=3; timeLeft=lv.time; timeTick=0; hurried=false; AU.speed=1;
  boss=null; bossActive=false; liftT=0; shake=0; msg=null; msgT=0; stompChain=0; flashT=0;
  Object.assign(P,{x:sx,y:GY-P.h,vx:0,vy:0,face:1,grounded:true,rider:null,inv:0,st:'idle',anim:0,
    coy:0,jbuf:0,airMax:PH.WALK,dj:true,flip:0,skid:false,oy:GY-P.h,hidden:false,gi:1,jumping:false,kick:0});
  cam.x=clamp(P.x-112,0,maxCam);
}
function startLevel(i,keep){
  aInit();
  if(!keep) score=0;
  levelStartScore=score; cpIndex=-1; cpStars=0;
  loadLevel(i); state='intro'; introT=0; playTrack(null);
}
function retry(){ score=levelStartScore; loadLevel(lvIdx); state='intro'; introT=70; playTrack(null); }
function beginPlay(){
  if(state==='play') return;
  state='play'; prevA=true; INP.jp=false; playTrack(lv.music);
  if(lvIdx===0&&cpIndex<0) say(TOUCH?'HOLD B TO RUN - A TO JUMP':'HOLD X TO RUN - Z TO JUMP',200);
}

/* ------------------------------ PHYSICS --------------------------------- */
function updateLifts(){
  liftT++;
  for(const l of lifts){
    const px=l.x,py=l.y,o=Math.sin(liftT*l.spd+l.ph)*l.range;
    if(l.axis==='x') l.x=l.ox+o; else l.y=l.oy+o;
    l.dx=l.x-px; l.dy=l.y-py;
  }
}
function moveBox(o){
  let hx=false,land=false;
  o.x+=o.vx;
  const r0=Math.floor(o.y/TS), r1=Math.floor((o.y+o.h-1)/TS);
  if(o.vx>0){ const c=Math.floor((o.x+o.w-1)/TS);
    for(let r=r0;r<=r1;r++) if(solidT(tileAt(c,r))){o.x=c*TS-o.w;hx=true;break;} }
  else if(o.vx<0){ const c=Math.floor(o.x/TS);
    for(let r=r0;r<=r1;r++) if(solidT(tileAt(c,r))){o.x=(c+1)*TS;hx=true;break;} }
  o.y+=o.vy;
  const c0=Math.floor(o.x/TS), c1=Math.floor((o.x+o.w-1)/TS);
  if(o.vy>=0){ const r=Math.floor((o.y+o.h)/TS);
    for(let c=c0;c<=c1;c++) if(solidT(tileAt(c,r))){o.y=r*TS-o.h;o.vy=0;land=true;break;} }
  else { const r=Math.floor(o.y/TS);
    for(let c=c0;c<=c1;c++) if(solidT(tileAt(c,r))){o.y=(r+1)*TS;o.vy=0;break;} }
  return {hx:hx,land:land};
}
function nearGround(){
  if(P.vy<=0) return false;
  const r=Math.floor((P.y+P.h+10)/TS);
  return solidT(tileAt(Math.floor((P.x+1)/TS),r))||solidT(tileAt(Math.floor((P.x+P.w-2)/TS),r));
}
function playerPhysics(){
  const dir=(INP.r?1:0)-(INP.l?1:0), run=INP.b||SAVE.autorun;
  let carry=0;
  if(P.rider){ carry=P.rider.dx; P.y+=P.rider.dy; }
  let fresh=false;
  if(INP.jp){ P.jbuf=6; INP.jp=false; fresh=true; }
  P.skid=false;
  if(P.grounded){
    const max=run?PH.RUN:PH.WALK, acc=run?PH.RACC:PH.WACC;
    if(dir){
      if(P.vx*dir<0){ P.vx+=dir*PH.SKID; P.skid=true; if(P.vx*dir>0) P.vx=0; }
      else { P.face=dir; const nv=P.vx+dir*acc;
        if(Math.abs(nv)<=max) P.vx=nv; else P.vx=Math.sign(P.vx)*Math.max(max,Math.abs(P.vx)-PH.REL); }
    } else P.vx-=Math.sign(P.vx)*Math.min(PH.REL,Math.abs(P.vx));
  } else if(dir){
    const acc=P.vx*dir<0?PH.RACC:(run?PH.RACC:PH.WACC), nv=P.vx+dir*acc;
    if(P.vx*dir<0||Math.abs(nv)<=P.airMax) P.vx=nv;
  }
  if(P.grounded){ P.coy=5; P.dj=true; P.airMax=Math.max(PH.WALK,Math.abs(P.vx)); }
  else if(P.coy>0) P.coy--;
  if(P.jbuf>0){
    P.jbuf--;
    if(P.coy>0){
      const s=Math.abs(P.vx); P.gi=s<1?0:(s<2.3125?1:2);
      P.vy=P.gi===2?-5:-4; P.airMax=Math.max(PH.WALK,s);
      P.coy=0; P.jbuf=0; P.grounded=false; P.rider=null; P.jumping=true; sfx('jump');
    } else if(fresh&&P.dj&&!nearGround()){
      P.vy=-3.75; P.dj=false; P.flip=24; P.jbuf=0; P.jumping=true; sfx('flip');
      burst(P.x+6,P.y+P.h,'#ffe07a',6,2); addScore(25);
    }
  }
  const g=(P.vy<0&&INP.a&&P.jumping)?G_HOLD[P.gi]:G_FALL[P.gi];
  P.vy=Math.min(PH.MAXF,P.vy+g);

  const mx=P.vx+carry;
  P.x+=mx;
  if(mx!==0){
    const r0=Math.floor(P.y/TS), r1=Math.floor((P.y+P.h-1)/TS);
    if(mx>0){ const c=Math.floor((P.x+P.w-1)/TS);
      for(let r=r0;r<=r1;r++) if(solidT(tileAt(c,r))){P.x=c*TS-P.w;if(P.vx>0)P.vx=0;break;} }
    else { const c=Math.floor(P.x/TS);
      for(let r=r0;r<=r1;r++) if(solidT(tileAt(c,r))){P.x=(c+1)*TS;if(P.vx<0)P.vx=0;break;} }
  }
  if(P.x<cam.x){ P.x=cam.x; if(P.vx<0) P.vx=0; }
  if(P.x>cols*TS-P.w){ P.x=cols*TS-P.w; P.vx=0; }

  P.oy=P.y; const pb=P.y+P.h; P.y+=P.vy;
  const wasG=P.grounded; P.grounded=false; P.rider=null;
  const cl=Math.floor(P.x/TS), cr=Math.floor((P.x+P.w-1)/TS);
  const land=()=>{ P.vy=0; P.grounded=true; P.jumping=false; P.flip=0; stompChain=0;
    if(!wasG) burst(P.x+6,P.y+P.h,'#e8e8e8',3,1); };
  if(P.vy<0){
    const r=Math.floor(P.y/TS);
    const sl=solidT(tileAt(cl,r)), sr=cr!==cl&&solidT(tileAt(cr,r));
    if(sl||sr){
      if(sl&&!sr&&cr!==cl&&(cl+1)*TS-P.x<=5) P.x=(cl+1)*TS;
      else if(sr&&!sl&&P.x+P.w-cr*TS<=5) P.x=cr*TS-P.w;
      else {
        P.y=(r+1)*TS; P.vy=1; P.jumping=false;
        const cc=Math.floor((P.x+P.w/2)/TS);
        hitBlock(solidT(tileAt(cc,r))?cc:(sl?cl:cr),r);
      }
    }
  } else {
    const r=Math.floor((P.y+P.h)/TS);
    for(let c=cl;c<=cr;c++) if(solidT(tileAt(c,r))){ P.y=r*TS-P.h; land(); break; }
    if(!P.grounded) for(const l of lifts){
      if(P.x+P.w>l.x&&P.x<l.x+l.w&&pb<=l.y+2+Math.abs(l.dy)&&P.y+P.h>=l.y){
        P.y=l.y-P.h; P.rider=l; land(); break; }
    }
  }
  if(P.flip>0) P.flip--;
  if(P.inv>0) P.inv--;
  if(P.kick>0) P.kick--;
  if(!P.grounded) P.st=P.flip>0?'flip':'air';
  else if(P.skid){ P.st='brake'; if(frames%4===0) burst(P.x+6,P.y+P.h,'#ffffff',2,1); }
  else if(Math.abs(P.vx)>0.3) P.st='roll';
  else P.st='idle';
  P.anim+=1+Math.abs(P.vx)*0.5;
  if(P.y>H+8) killPlayer(true);
}
function hitBlock(c,r){
  const t=tileAt(c,r);
  if(t===T_Q){
    setT(c,r,T_USED); bumps.push({c:c,r:r,t:0});
    if(qmap[c+','+r]==='heart'){ items.push({x:c*TS+2,y:r*TS,w:12,h:12,vx:0,vy:0,em:12}); sfx('sprout'); }
    else { starsGot++; addScore(200); sfx('coin'); coinsFx.push({x:c*TS,y:r*TS-16,vy:-4.5,t:26}); }
    bumpAbove(c,r);
  } else if(t===T_BRICK){
    setT(c,r,0); sfx('brick'); addScore(50); bumpAbove(c,r);
    for(let k=0;k<4;k++) particles.push({x:c*TS+4+(k%2)*8,y:r*TS+4+(k>>1)*8,
      vx:(k%2?1.4:-1.4),vy:(k>>1)?-3:-5,t:60,c:'#c84c0c',s:4});
  } else sfx('bump');
}
function bumpAbove(c,r){
  for(const f of foes){
    if(!f.active||f.state==='flip'||f.state==='flat') continue;
    if(f.x+f.w>c*TS&&f.x<(c+1)*TS&&Math.abs(f.y+f.h-r*TS)<=4) knock(f,100);
  }
  for(const it of items){ if(it.em<=0&&it.x+it.w>c*TS&&it.x<(c+1)*TS&&Math.abs(it.y+it.h-r*TS)<=4) it.vy=-3; }
  if(tileAt(c,r-1)===T_STAR){ setT(c,r-1,0); starsGot++; addScore(200); sfx('coin');
    coinsFx.push({x:c*TS,y:(r-1)*TS,vy:-4,t:24}); }
}
function collectTiles(){
  const c0=Math.floor(P.x/TS),c1=Math.floor((P.x+P.w-1)/TS),r0=Math.floor(P.y/TS),r1=Math.floor((P.y+P.h-1)/TS);
  for(let c=c0;c<=c1;c++) for(let r=r0;r<=r1;r++) if(tileAt(c,r)===T_STAR){
    setT(c,r,0); starsGot++; addScore(100); sfx('coin'); burst(c*TS+8,r*TS+8,'#ffe07a',6,1.8);
  }
}
function damage(){
  if(P.inv>0||state!=='play') return;
  hearts--; shake=8;
  if(hearts<=0){ hearts=0; killPlayer(false); return; }
  P.inv=120; sfx('hurt'); P.vy=-3; P.vx=-P.face*1.2; P.grounded=false; P.jumping=false;
  burst(P.x+6,P.y+10,'#ff6a6a',8,2.5);
}
function killPlayer(pitFall){
  if(state!=='play') return;
  state='dying'; dieT=0; P.vx=0; P.vy=pitFall?0:-5; P.st='hurt'; P.hidden=!!pitFall;
  playTrack(null); sfx('die');
}
function bounce(){ P.vy=INP.a?-5:-3.5; P.jumping=INP.a; P.gi=1; P.dj=true; P.grounded=false; }

/* ------------------------------ ENEMIES --------------------------------- */
function knock(f,pts){
  f.state='flip'; f.vy=-3; f.vx=Math.random()<0.5?-0.7:0.7;
  addScore(pts||100,f.x,f.y-8); sfx('kick');
}
function updateFoes(){
  for(let i=foes.length-1;i>=0;i--){
    const f=foes[i];
    if(!f.active){ if(f.x<cam.x+W+24) f.active=true; else continue; }
    f.t++;
    if(f.state==='flat'){ if(--f.tm<=0) foes.splice(i,1); continue; }
    if(f.state==='flip'){ f.vy+=0.25; f.x+=f.vx; f.y+=f.vy; if(f.y>H+16) foes.splice(i,1); continue; }
    if(f.state==='shell'){ f.vx=0;
      if(f.t>360){ f.state='walk'; f.y-=4; f.h=16; f.vx=P.x<f.x?-0.5:0.5; } }
    f.vy=Math.min(4,f.vy+0.25);
    const res=moveBox(f);
    if(res.hx){ f.vx=-f.vx; if(f.state==='slide'&&f.x<cam.x+W) sfx('bump'); }
    if(f.kind==='ball'&&f.state==='walk'&&res.land) f.vy=-3;
    if(f.y>H+16||f.x+f.w<cam.x-48){ foes.splice(i,1); continue; }
    if(f.state==='slide'){
      for(const o of foes){
        if(o!==f&&o.active&&o.state!=='flip'&&o.state!=='flat'&&hit(f,o))
          knock(o,CHAIN[Math.min(f.chain++,CHAIN.length-1)]);
      }
    }
    if(state!=='play'||!hit(P,f)) continue;
    const stomp=P.vy>0&&P.oy+P.h<=f.y+6;
    if(f.state==='shell'){
      f.state='slide'; f.chain=0; f.t=0;
      f.vx=(P.x+P.w/2<f.x+f.w/2)?3.5:-3.5; P.kick=16; sfx('kick'); addScore(400,f.x,f.y-8);
      if(stomp) bounce();
      continue;
    }
    if(stomp){
      bounce();
      const pts=CHAIN[Math.min(stompChain++,CHAIN.length-1)];
      if(f.kind==='bot'){ if(f.state==='walk'){ f.y+=4; f.h=12; } f.state='shell'; f.vx=0; f.t=0; }
      else if(f.kind==='rc'){ f.state='flat'; f.tm=30; f.vx=0; }
      else { burst(f.x+7,f.y+7,'#ffffff',8,2.5); burst(f.x+7,f.y+7,'#2f9fe0',6,2.5); foes.splice(i,1); }
      sfx('stomp'); addScore(pts,f.x,f.y-8);
      continue;
    }
    if(f.state==='slide'&&P.kick>0) continue;
    damage();
  }
  for(let i=0;i<foes.length;i++){ const a=foes[i]; if(!a.active||a.state!=='walk') continue;
    for(let j=i+1;j<foes.length;j++){ const b=foes[j]; if(!b.active||b.state!=='walk') continue;
      if(hit(a,b)){
        if((a.x<b.x&&a.vx>0)||(a.x>b.x&&a.vx<0)) a.vx=-a.vx;
        if((b.x<a.x&&b.vx>0)||(b.x>a.x&&b.vx<0)) b.vx=-b.vx;
      }
    }
  }
}
function updateItems(){
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];
    if(it.em>0){ it.y-=1; if(--it.em===0) it.vx=1; }
    else { it.vy=Math.min(4,it.vy+0.25); const r=moveBox(it); if(r.hx) it.vx=-it.vx; }
    if(it.y>H+16){ items.splice(i,1); continue; }
    if(state==='play'&&it.em<=0&&hit(P,it)){
      items.splice(i,1);
      if(hearts<3){ hearts++; say('+1 HEART!',60); }
      addScore(1000,it.x,it.y-8); sfx('power');
    }
  }
}
function checkpoints(){
  for(let i=cpIndex+1;i<LD.cps.length;i++){
    if(P.x>=LD.cps[i]){ cpIndex=i; cpStars=starsGot; sfx('check'); say('CHECKPOINT!',80);
      burst(LD.cps[i]+8,GY-30,'#7fe8ff',12,2.5); addScore(500); }
  }
}
function updFx(){
  for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.2; if(--p.t<=0) particles.splice(i,1); }
  for(let i=popups.length-1;i>=0;i--){ const p=popups[i]; p.y-=0.6; if(--p.t<=0) popups.splice(i,1); }
  for(let i=coinsFx.length-1;i>=0;i--){ const c=coinsFx[i]; c.vy+=0.35; c.y+=c.vy;
    if(--c.t<=0){ popups.push({x:c.x+8,y:c.y,text:'200',t:40}); coinsFx.splice(i,1); } }
  for(let i=bumps.length-1;i>=0;i--){ if(++bumps[i].t>=8) bumps.splice(i,1); }
  if(shake>0) shake--;
}

/* ------------------------------- BOSS ----------------------------------- */
function startBoss(){
  const cfg=BOSSES[lv.cousin];
  bossActive=true; foes=[]; items=[]; projectiles=[];
  boss={cfg:cfg,key:lv.cousin,need:cfg.need,hits:0,phase:0,x:arenaX+200,y:GY-28,w:16,h:28,
    state:'tele',t:100,spawnT:0,pi:0,orb:null,dir:-1,fl:0,done:false,doneT:0};
  playTrack('boss');
  say(lv.cousin==='g'?'BABY SISTER G WANTS TO PLAY!':lv.short+' BLOCKS THE WAY!',150);
}
function phaseCfg(){ const ph=boss.cfg.phases; return ph[Math.min(boss.phase,ph.length-1)]; }
function spawnProj(kind){
  const bx=boss.x+2; sfx('throw');
  if(kind==='roll') projectiles.push({kind:kind,x:bx,y:GY-12,w:12,h:12,vx:-1.6,vy:0,t:400});
  else if(kind==='low') projectiles.push({kind:kind,x:bx,y:GY-12,w:12,h:12,vx:-2.2,vy:0,t:400});
  else if(kind==='high') projectiles.push({kind:kind,x:bx,y:GY-46,w:14,h:8,vx:-2,vy:0,t:400});
  else if(kind==='bounce') projectiles.push({kind:kind,x:bx,y:GY-40,w:14,h:14,vx:-1.5,vy:-1.5,t:500});
  else if(kind==='drop'){
    const tx=clamp(P.x+P.w/2-6+(Math.random()*32-16),arenaX+8,arenaX+W-20);
    projectiles.push({kind:kind,x:tx,y:-16,w:12,h:14,vx:0,vy:0,t:500,warn:50}); sfx('warn');
  }
}
function updateBoss(){
  if(boss.fl>0) boss.fl--;
  boss.x+=boss.dir*0.35;
  if(boss.x<arenaX+170){ boss.x=arenaX+170; boss.dir=1; }
  if(boss.x>arenaX+226){ boss.x=arenaX+226; boss.dir=-1; }
  if(boss.done){
    boss.doneT++;
    if(boss.doneT===1){ sfx('clear'); playTrack('win'); }
    updateProjectiles();
    if(boss.doneT>150) finishLevel();
    return;
  }
  const cfg=phaseCfg(); boss.t--;
  if(boss.state==='tele'){ if(boss.t<=0){ boss.state='atk'; boss.t=cfg.atk; boss.spawnT=20; } }
  else if(boss.state==='atk'){
    if(--boss.spawnT<=0){ spawnProj(cfg.pat[boss.pi%cfg.pat.length]); boss.pi++; boss.spawnT=cfg.gap; }
    if(boss.t<=0){
      projectiles=[]; boss.state='open'; boss.t=cfg.open; sfx('open');
      boss.orb={x:boss.x+1,y:GY-76,w:14,h:14};
      if(cfg.extra) spawnProj('roll');
    }
  } else if(boss.state==='open'){
    boss.orb.x=boss.x+1;
    if(hit(P,boss.orb)) tagBoss();
    else if(boss.t<=0){ boss.state='tele'; boss.t=60; boss.orb=null; }
  } else if(boss.state==='hurt'){ if(boss.t<=0){ boss.state='tele'; boss.t=62; } }
  updateProjectiles();
}
function tagBoss(){
  boss.hits++; boss.orb=null; boss.state='hurt'; boss.t=58; boss.fl=30;
  addScore(500,boss.x,boss.y-12); sfx('tag'); shake=8; flashT=10;
  burst(boss.x+8,boss.y+6,'#ffe07a',16,3.2);
  P.vy=-4.5; P.dj=true; P.jumping=false;
  projectiles=[];
  const ph=boss.cfg.phases;
  if(ph.length>1){
    const per=Math.ceil(boss.need/ph.length), np=Math.min(ph.length-1,Math.floor(boss.hits/per));
    if(np>boss.phase){ boss.phase=np; say('PHASE '+(np+1)+'! FASTER!',110); shake=12; }
  }
  if(boss.hits>=boss.need){
    boss.done=true; boss.doneT=0; projectiles=[];
    say(lv.cousin==='g'?'G GIGGLES... AND WANTS A HUG!':lv.short+' IS TAGGED OUT!',150);
    burst(boss.x+8,boss.y+10,'#ffffff',26,4);
  }
}
function updateProjectiles(){
  const gk=boss&&boss.key==='g';
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i]; p.t--;
    if(p.kind==='drop'){
      if(p.warn>0){ if(--p.warn===0) p.vy=1; continue; }
      p.vy+=0.22; p.y+=p.vy;
      if(p.y>GY-p.h){ burst(p.x+6,GY-6,gk?'#fff3c0':'#7fd8ff',10,2.4); projectiles.splice(i,1); continue; }
    } else if(p.kind==='bounce'){
      p.vy+=0.3; p.x+=p.vx; p.y+=p.vy;
      if(p.y>GY-p.h){ p.y=GY-p.h; p.vy=-5; }
    } else p.x+=p.vx;
    if(p.x<arenaX-24||p.t<=0){ projectiles.splice(i,1); continue; }
    if(state==='play'&&P.inv<=0&&hit(P,p)){ damage(); projectiles.splice(i,1); }
  }
}
function finishLevel(){
  state='clear'; clearT=0; tallyDone=false;
  clearBonus=hearts*500+(starsGot>=totalStars?2000:0);
  score+=clearBonus;
}
function finishTally(){
  if(tallyDone) return;
  score+=timeLeft*50; timeLeft=0; tallyDone=true; AU.speed=1;
  SAVE.best[lvIdx]=Math.max(SAVE.best[lvIdx]||0,score-levelStartScore);
  SAVE.stars[lvIdx]=Math.max(SAVE.stars[lvIdx]||0,starsGot);
  SAVE.unlocked=Math.max(SAVE.unlocked,Math.min(5,lvIdx+2));
  writeSave();
}

/* ------------------------------- UPDATE --------------------------------- */
function mergeInput(){
  INP.l=KB.l||TP.l; INP.r=KB.r||TP.r; INP.b=KB.b||TP.b;
  const a=KB.a||KB.u||TP.a;
  if(a&&!prevA&&state==='play') INP.jp=true;
  prevA=a; INP.a=a;
  if(state!=='play') INP.jp=false;
}
function updPlay(){
  updateLifts(); playerPhysics(); if(state!=='play') return;
  updateItems(); updateFoes(); if(state!=='play') return;
  collectTiles(); checkpoints();
  if(bossActive){ if(cam.x<arenaX) cam.x=Math.min(arenaX,cam.x+3); }
  else { const tx=P.x-112; if(tx>cam.x) cam.x=Math.min(tx,maxCam); }
  if(!bossActive&&P.x>arenaX+40) startBoss();
  if(bossActive&&boss) updateBoss();
  if(state!=='play') return;
  if(!(boss&&boss.done)){
    if(++timeTick>=24){
      timeTick=0; timeLeft--;
      if(timeLeft===100&&!hurried){ hurried=true; sfx('hurry'); AU.speed=1.4; say('HURRY UP!',90); }
      if(timeLeft<=0){ timeLeft=0; killPlayer(false); }
    }
  }
  updFx();
}
function updDying(){
  dieT++;
  if(!P.hidden&&dieT>24){ P.vy=Math.min(5,P.vy+0.25); P.y+=P.vy; }
  updFx();
  if(dieT>150){ state='dead'; deadT=0; }
}
function updClear(){
  if(!tallyDone){
    if(timeLeft>0){ const n=Math.min(timeLeft,3); timeLeft-=n; score+=n*50; if(frames%3===0) sfx('tick'); }
    else finishTally();
  }
}
function update(){
  frames++;
  mergeInput();
  if(flashT>0) flashT--;
  if(state==='play') updPlay();
  else if(state==='intro'){ introT++; if(introT>170) beginPlay(); }
  else if(state==='dying') updDying();
  else if(state==='clear'){ clearT++; updClear(); updFx(); }
  else if(state==='dead') deadT++;
  else if(state==='victory') winT++;
  if(msgT>0&&--msgT===0) msg=null;
}
function render(){
  uiHits.length=0;
  switch(state){
    case 'title': drawTitle(); break;
    case 'select': drawSelect(); break;
    case 'howto': drawHowTo(); break;
    case 'options': drawOptions(); break;
    case 'intro': drawIntro(); break;
    case 'play': case 'dying': renderWorld(); break;
    case 'pause': drawPause(); break;
    case 'dead': drawDead(); break;
    case 'clear': drawClear(); break;
    case 'victory': drawVictory(); break;
  }
  if(msg&&(state==='options'||state==='select')) TO(msg,W/2,226,'#ffffff',8,'center');
  if(flashT>0){ ctx.fillStyle='rgba(255,255,255,'+(flashT/10*0.5)+')'; ctx.fillRect(0,0,W,H); }
  if(SAVE.scan){ ctx.fillStyle='rgba(0,0,0,0.2)'; const lh=K>=2?0.5:1; for(let y=1;y<H;y+=2) ctx.fillRect(0,y,W,lh); }
}
const STEP=1000/60;
let last=0, acc=0;
function loop(now){
  requestAnimationFrame(loop);
  if(!last) last=now;
  let dt=now-last; last=now;
  if(dt>100) dt=100; if(dt<0) dt=0;
  acc+=dt;
  let n=0;
  while(acc>=STEP-1&&n<4){ update(); acc-=STEP; n++; }
  if(n>=4) acc=0;
  if(n>0) render();
  musicUpdate();
}

/* -------------------------------- MENUS --------------------------------- */
function menuAction(){
  switch(state){
    case 'title': sfx('menu');
      if(menuSel===0) startLevel(0,false);
      else if(menuSel===1){ state='select'; selSel=Math.min(SAVE.unlocked-1,4); }
      else if(menuSel===2) state='howto';
      else { state='options'; menuSel=0; }
      break;
    case 'select':
      if(selSel<SAVE.unlocked){ sfx('menu'); startLevel(selSel,false); } else sfx('bump');
      break;
    case 'howto': sfx('menu'); state='title'; menuSel=2; break;
    case 'options': sfx('menu'); optionAct(menuSel); break;
    case 'pause': sfx('menu'); pauseAct(menuSel); break;
    case 'intro': beginPlay(); break;
    case 'clear':
      if(!tallyDone) finishTally();
      else if(clearT>30){ if(lvIdx<4) startLevel(lvIdx+1,true); else { state='victory'; winT=0; playTrack('win'); } }
      break;
    case 'dead': if(deadT>30) retry(); break;
    case 'victory': if(winT>40){ state='select'; selSel=4; playTrack('menu'); } break;
  }
}
function optionAct(i){
  if(i===0) SAVE.sound=!SAVE.sound;
  else if(i===1) SAVE.music=!SAVE.music;
  else if(i===2) SAVE.scan=!SAVE.scan;
  else if(i===3){ SAVE.flip=!SAVE.flip; applyFlip(); }
  else if(i===4) SAVE.autorun=!SAVE.autorun;
  else if(i===5){ const s=defSave(); s.sound=SAVE.sound; s.music=SAVE.music; s.scan=SAVE.scan;
    s.flip=SAVE.flip; s.autorun=SAVE.autorun; SAVE=s; say('SAVE DATA ERASED',90); }
  else { state='title'; menuSel=3; }
  writeSave();
}
function pauseAct(i){
  if(i===0) resume();
  else if(i===1){ cpIndex=-1; cpStars=0; score=levelStartScore; loadLevel(lvIdx); state='intro'; introT=0; playTrack(null); }
  else if(i===2){ SAVE.sound=!SAVE.sound; writeSave(); }
  else if(i===3){ SAVE.music=!SAVE.music; writeSave(); }
  else { state='select'; selSel=lvIdx; playTrack('menu'); }
}
function resume(){ state='play'; prevA=true; INP.jp=false; playTrack(pausedTrack||(bossActive?'boss':lv.music)); }
function menuBack(){
  switch(state){
    case 'play': pausedTrack=AU.name; playTrack(null); sfx('pause'); state='pause'; menuSel=0; break;
    case 'pause': resume(); break;
    case 'select': case 'howto': case 'options': sfx('menu'); state='title'; menuSel=0; break;
    case 'dead': case 'clear':
      if(state==='clear') finishTally();
      sfx('menu'); state='select'; selSel=Math.min(SAVE.unlocked-1,lvIdx); playTrack('menu'); break;
    case 'victory': state='title'; menuSel=0; playTrack('menu'); break;
    case 'intro': beginPlay(); break;
  }
}
function menuMove(dx,dy){
  if(state==='title'){ if(dy){ menuSel=wrap(menuSel+dy,4); sfx('menu'); } }
  else if(state==='options'){ if(dy){ menuSel=wrap(menuSel+dy,7); sfx('menu'); } }
  else if(state==='pause'){ if(dy){ menuSel=wrap(menuSel+dy,5); sfx('menu'); } }
  else if(state==='select'){ const d=dx||dy; if(d){ selSel=clamp(selSel+d,0,4); sfx('menu'); } }
}
function padPress(k){
  if(state==='play') return;
  if(k==='a') menuAction();
  else if(k==='b'){ if(state==='select'||state==='howto'||state==='options'||state==='pause') menuBack(); }
  else if(k==='u') menuMove(0,-1);
  else if(k==='d') menuMove(0,1);
  else if(k==='l') menuMove(-1,0);
  else if(k==='r') menuMove(1,0);
}
function startBtn(){ if(state==='play'||state==='pause'||state==='intro') menuBack(); else menuAction(); }
function ensureMusic(){
  if(!AU.name&&(state==='title'||state==='select'||state==='howto'||state==='options')) playTrack('menu');
}
function clearInputs(){
  for(const k in KB) KB[k]=false;
  for(const k in TP) TP[k]=false;
  INP.l=INP.r=INP.a=INP.b=INP.jp=false; prevA=false;
}
function tapUI(x,y){
  for(let i=uiHits.length-1;i>=0;i--){
    const h=uiHits[i];
    if(x>=h.x&&x<h.x+h.w&&y>=h.y&&y<h.y+h.h){ h.fn(); return; }

const KEYMAP={arrowleft:'l',a:'l',arrowright:'r',d:'r',arrowup:'u',w:'u',arrowdown:'d',s:'d',
  z:'a',' ':'a',k:'a',x:'b',shift:'b',j:'b'};
addEventListener('keydown',e=>{
  const k=(e.key||'').toLowerCase();
  if([' ','arrowup','arrowdown','arrowleft','arrowright'].indexOf(k)>=0) e.preventDefault();
  aInit(); ensureMusic();
  const m=KEYMAP[k];
  if(m) KB[m]=true;
  if(e.repeat) return;
  if(k==='m'){ SAVE.sound=!SAVE.sound; writeSave(); say('SOUND '+(SAVE.sound?'ON':'OFF'),60); return; }
  if(k==='n'){ SAVE.music=!SAVE.music; writeSave(); say('MUSIC '+(SAVE.music?'ON':'OFF'),60); return; }
  if(k==='enter'){ if(state==='play') menuBack(); else menuAction(); return; }
  if(k==='escape'){ menuBack(); return; }
  if(k==='p'){ if(state==='play'||state==='pause') menuBack(); return; }
  if(m) padPress(m);
});
addEventListener('keyup',e=>{ const m=KEYMAP[(e.key||'').toLowerCase()]; if(m) KB[m]=false; });

function inR(rc,x,y,m){ return x>=rc.left-m&&x<=rc.right+m&&y>=rc.top-m&&y<=rc.bottom+m; }
function ctlRects(){

function readTouches(list,R_){
  const n={l:false,r:false,u:false,d:false,a:false,b:false,s:false};
  for(let i=0;i<list.length;i++){
    const t=list[i], x=t.clientX, y=t.clientY;
    if(inR(R_.dp,x,y,28)){
      const cx=(R_.dp.left+R_.dp.right)/2, cy=(R_.dp.top+R_.dp.bottom)/2, dx=x-cx, dy=y-cy, ax=Math.abs(dx), ay=Math.abs(dy);
      if(ax>12&&ax>ay*0.45){ if(dx<0) n.l=true; else n.r=true; }
      if(ay>12&&ay>ax*0.45){ if(dy<0) n.u=true; else n.d=true; }
      continue;
    }
    if(inR(R_.S,x,y,8)){ n.s=true; continue; }
    if(inR(R_.A,x,y,16)) n.a=true;
    if(inR(R_.B,x,y,16)) n.b=true;
  }
  return n;
}
function onTouch(e){
  e.preventDefault();
  aInit(); ensureMusic();
  const R_=ctlRects();
  if(e.type==='touchstart'){
    for(let i=0;i<e.changedTouches.length;i++){
      const t=e.changedTouches[i];
      if(!onControl(t,R_)){
        const rc=cvs.getBoundingClientRect();
        tapUI((t.clientX-rc.left)/rc.width*W,(t.clientY-rc.top)/rc.height*H);
      }
    }
  }
  const n=readTouches(e.touches,R_);
  ['l','r','u','d','a','b','s'].forEach(k=>{
    if(n[k]&&!TP[k]){ if(k==='s') startBtn(); else padPress(k); }
  });
  Object.assign(TP,n);
  for(const k in dspans) dspans[k].classList.toggle('on',TP[k]);
  elA.classList.toggle('on',SAVE.flip?TP.b:TP.a);
  elB.classList.toggle('on',SAVE.flip?TP.a:TP.b);
  elS.classList.toggle('on',TP.s);
}
['touchstart','touchmove','touchend','touchcancel'].forEach(ev=>
  document.addEventListener(ev,onTouch,{passive:false}));
cvs.addEventListener('mousedown',e=>{
  aInit(); ensureMusic();
  const rc=cvs.getBoundingClientRect();
  tapUI((e.clientX-rc.left)/rc.width*W,(e.clientY-rc.top)/rc.height*H);
});
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('contextmenu',e=>e.preventDefault());
function autoPause(){
  clearInputs();
  if(state==='play'){ pausedTrack=AU.name; playTrack(null); state='pause'; menuSel=0; }
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ autoPause(); if(AU.ctx&&AU.ctx.state==='running'){ const p=AU.ctx.suspend(); if(p&&p.catch) p.catch(()=>{}); } }
});
addEventListener('blur',autoPause);
addEventListener('pagehide',autoPause);

/* --------------------------- LAYOUT (iOS) ------------------------------- */
const saEl=document.getElementById('sa');
function layout(){
  const cs=getComputedStyle(saEl);
  const sT=parseFloat(cs.paddingTop)||0, sR=parseFloat(cs.paddingRight)||0,
        sB=parseFloat(cs.paddingBottom)||0, sL=parseFloat(cs.paddingLeft)||0;
  const vw=window.innerWidth, vh=window.innerHeight, portrait=vh>vw;
  let s,x,y,ov=false;
  document.body.classList.toggle('pt',TOUCH&&portrait);
  if(TOUCH&&portrait){
    const ctrl=190;
    s=Math.min(vw/W,(vh-sT-sB-ctrl)/H);
    if(s<vw/W*0.8) s=Math.min(vw/W,(vh-sT-sB)/H);
    x=(vw-W*s)/2; y=sT+Math.max(0,((vh-sT-sB-ctrl)-H*s)/3);
    ov=y+H*s>vh-sB-ctrl+4;
  } else {
    const aw=vw-sL-sR, ah=vh-sT-sB;
    s=Math.min(aw/W,ah/H);
    x=sL+(aw-W*s)/2; y=sT+(ah-H*s)/2;
    ov=TOUCH&&(x-sL)<165;
  }
  s=Math.max(0.5,s);
  cvs.style.left=x+'px'; cvs.style.top=y+'px';
  cvs.style.width=(W*s)+'px'; cvs.style.height=(H*s)+'px';
  document.body.classList.toggle('ov',ov);
  const nk=clamp(Math.ceil(s*(window.devicePixelRatio||1)),1,4);
  if(nk!==K||cvs.width!==W*nk){ K=nk; cvs.width=W*K; cvs.height=H*K; }
  ctx.setTransform(K,0,0,K,0,0); ctx.imageSmoothingEnabled=false; curFont='';
}

/* -------------------------------- BOOT ---------------------------------- */
if(TOUCH) padEl.style.display='block';
applyFlip();
layout();
addEventListener('resize',layout);
addEventListener('orientationchange',()=>setTimeout(layout,250));
if(window.visualViewport) window.visualViewport.addEventListener('resize',layout);
lv=LEVELS[0]; state='title'; menuSel=0;
requestAnimationFrame(loop);
})();
